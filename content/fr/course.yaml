# Topics (pack format 1.2, tosk/docs/pack-format.md "Topics"): themed side trees, each drawn as its own
# map, with a branch leaving the main tree at its anchor (the last main-tree skill its first skill
# requires); a later skill of a topic may require a later main-tree skill and waits for it. The main
# tree keeps the grammar and the core vocabulary; themed vocabulary lives in these topics, so a learner
# may skip them (tosk/docs/topic-split.md). The fairness rule (tosk/docs/extensions.md): never unknown
# grammar, some unknown words are fine.
