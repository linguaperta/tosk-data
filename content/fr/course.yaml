# French course for English speakers, B1-B2 (an advanced learner: the basics are compact but complete).
# Skills select their items with queries (see tosk/pipeline/pipeline/query.py); the compiler resolves
# them into skill_items/skill_facets, so the app never reads these queries.
#
# Variety: standard French of France. Language rules for the pipeline: pipeline/pipeline/lang_fr.py
# (elision, hyphenated inversion and imperatives, reflexive verbs as verb + pronoun, participle
# agreement, mood homographs such as parle = present / subjunctive).
#
# Grammar gating (tosk/docs/ARCHITECTURE.md, "Grammar gating"; pipeline/pipeline/features.py): a learner
# never meets a grammar construct before the skill that introduces it. The present is allowed from the
# start; every other feature below is introduced by one skill (a verbs skill introduces tense:{T} by
# itself). Each unit's skills require the previous unit's grammar, so every later skill allows
# everything taught before it.
id: fr
version: 1.0.0
title: {en: French}
description:
  en: "French for advanced learners (B1-B2): every tense and mood, pronouns, the subjunctive and reading French, with themed topics."
target: fr
translations: [en]
required_translations: [en]
note_langs: [en]
unverified: true
# topics (pack format 1.2) need app 0.7.5 (tosk/docs/topic-split.md, "Versions and old apps")
min_app_version: 0.7.5
license: CC-BY-SA-4.0
authors:
  - {name: "tosk contributors", role: author, url: "https://github.com/linguaperta/tosk-data"}
data_sources:
  - {id: wiktionary, title: "Wiktionary (via kaikki.org)", url: "https://kaikki.org", license: CC-BY-SA-4.0}
  - {id: tatoeba, title: Tatoeba, url: "https://tatoeba.org", license: CC-BY-2.0-FR}
  - {id: frequencywords, title: "FrequencyWords (hermitdave, OpenSubtitles 2018)", url: "https://github.com/hermitdave/FrequencyWords", license: CC-BY-SA-4.0}
  - {id: claude-gen, title: "Sentences, stories and notes written with Claude (Anthropic)", license: CC-BY-SA-4.0}
persons: [je, tu, il/elle, nous, vous, ils/elles]
person_labels:
  je: {en: "je/j' (I)"}
  tu: {en: "tu (you)"}
  il/elle: {en: "il/elle/on (he/she/one)"}
  nous: {en: "nous (we)"}
  vous: {en: "vous (you, plural or formal)"}
  ils/elles: {en: "ils/elles (they)"}
tenses: [present, passe_compose, imparfait, futur, plus_que_parfait, futur_anterieur, conditionnel,
         conditionnel_passe, subjonctif, subjonctif_passe, imperatif, passe_simple]
tense_labels:
  present: {en: present}
  passe_compose: {en: "perfect (passé composé)"}
  imparfait: {en: "imperfect (imparfait)"}
  futur: {en: "future (futur simple)"}
  plus_que_parfait: {en: "pluperfect (plus-que-parfait)"}
  futur_anterieur: {en: "future perfect (futur antérieur)"}
  conditionnel: {en: "conditional (conditionnel présent)"}
  conditionnel_passe: {en: "past conditional (conditionnel passé)"}
  subjonctif: {en: "subjunctive (subjonctif présent)"}
  subjonctif_passe: {en: "past subjunctive (subjonctif passé)"}
  imperatif: {en: imperative}
  passe_simple: {en: "simple past of narration (passé simple)"}
# the imperative has only tu, nous and vous
tense_persons:
  imperatif: [tu, nous, vous]
tense_person_labels:
  imperatif:
    tu: {en: "tu (you)"}
    nous: {en: "nous (let's)"}
    vous: {en: "vous (you, plural or formal)"}
# the transform exercise changes the tense only within one group: the indicative tenses (unlisted),
# never into or out of a mood (Il parle -> *Qu'il parle; S'il pleut, je reste -> *je resterais)
tense_groups:
  conditionnel: conditional
  conditionnel_passe: conditional
  subjonctif: subjunctive
  subjonctif_passe: subjunctive
  imperatif: imperative
articles: [le, la, "l'"]

# Inflection tables of non-verbs (tosk/docs/ARCHITECTURE.md, "Inflection tables"; the importer fills them
# from Wiktionary, pipeline/pipeline/inflect.py fr_number / fr_agreement).
inflection_tables:
  number:
    title: {en: singular and plural}
    pos: [noun]
    cells: [sg, pl]
    base: sg
    labels:
      sg: {en: singular}
      pl: {en: plural}
  agreement:
    title: {en: gender and number}
    pos: [adj, det]
    cells: [m.sg, f.sg, m.pl, f.pl]
    base: m.sg
    agreement: true
    labels:
      m.sg: {en: masculine singular}
      f.sg: {en: feminine singular}
      m.pl: {en: masculine plural}
      f.pl: {en: feminine plural}

base_features: ["tense:present"]
feature_detectors:
  # ne ... jamais / rien / personne / aucun / ni (ne ... pas is allowed from the start)
  negation: {type: words, words: [jamais, rien, personne, aucun, aucune, nulle, ni, guère]}
  # questions by inversion: parlez-vous ? a-t-il ? est-ce que ...
  inversion:
    type: pattern
    pattern: "[\\w']-(t-)?(je|tu|il|elle|on|ils|elles|ce)\\b|(?<!rendez)-(nous|vous)\\b[^.!]*\\?"
  # pouvoir/vouloir/devoir/savoir + infinitive (je peux venir, il doit partir)
  modal: {type: modal_infinitive, verbs: [pouvoir, vouloir, devoir, savoir]}
  # the near future: aller + infinitive (je vais partir) and the recent past: venir de + infinitive
  futur_proche: {type: modal_infinitive, verbs: [aller]}
  venir_de:
    type: pattern
    annotate: true
    pattern: "\\b(viens|vient|venons|venez|viennent|venais|venait|venions|veniez|venaient)\\{[^}]*\\}\\s+(de\\{\\}\\s+|d'\\{\\})([^\\s{]+\\{\\}\\s*)*?[^\\s{]+\\{infinitive\\._\\}"
  # the pronouns y and en (j'y vais, il en veut deux); 'il y a' (there is) is allowed from the start
  "pronoun:y":
    type: pattern
    pattern: "(^|[\\s'])y\\b(?!\\s+(a|avait|aura|aurait|ait|eut|avoir|a-t-il|avait-il|aura-t-il|aurait-il)\\b)|-y\\b"
  "pronoun:en":
    type: pattern
    annotate: true
    pattern: "(^|[\\s}])en\\{\\}\\s*(y\\{\\}\\s*)?[^\\s{]+\\{([a-z_]+\\.(je|tu|il/elle|nous|vous|ils/elles)|infinitive\\._)\\}|-en\\b|t'en\\b"
  # two object pronouns together: il me le donne, je le lui dis, je m'en vais, donne-le-moi
  "pronoun:combined":
    type: pattern
    pattern: "\\b(je|j'|tu|il|elle|on|nous|vous|ils|elles|ne|n')\\s+(me|te|se|nous|vous)\\s+(le|la|les|l')|\\b(le|la|les|l')\\s+(lui|leur)\\b|\\b(m'|t'|s'|lui\\s+|leur\\s+)en\\b|-(le|la|les)-(moi|toi|lui|nous|vous|leur)\\b"
  # the passé composé with être (je suis allé, elle est partie) and participle agreement (elle est
  # allée; je les ai vues: an agreeing participle that is no form of the avoir table)
  "aux:etre": {type: compound_aux, aux: être}
  agreement: {type: enclitic, tense: passe_compose}
  # irregular participles (fait, dit, pris, vu, mis, eu, été, écrit, ouvert, venu)
  "irregular:passe_compose": {type: irregular_tense, tense: passe_compose}
  # a reflexive pronoun of the verb's own person (je me lève, nous nous sommes vus)
  reflexive:
    type: reflexive
    pronouns: {me: je, "m'": je, te: tu, "t'": tu, se: [il/elle, ils/elles], "s'": [il/elle, ils/elles], nous: nous, vous: vous}
    clitics: [le, la, les, "l'", y, en, lui, leur, ne, "n'"]
    subject_pronouns: [nous, vous]
  # irregular future and conditional stems (serai, aurai, irai, ferai, pourrai, viendrai, verrai)
  "irregular:futur": {type: irregular_tense, tense: futur}
  "irregular:conditionnel": {type: irregular_tense, tense: conditionnel}
  # irregular imperatives (sois, aie, sache, veuille, va), with pronouns (donne-moi, lève-toi), negative (ne parle pas)
  "irregular:imperatif": {type: irregular_tense, tense: imperatif}
  "imperative:pronoun": {type: enclitic, tense: imperatif}
  "imperative:negative":
    type: pattern
    annotate: true
    pattern: "(^|[.!?;:,«\"]\\s*)(ne|n')\\{\\}\\s*((me|te|se|le|la|les|lui|leur|y|en|nous|vous|m'|t'|l')\\{\\}\\s*)*[^\\s{]+\\{imperatif\\."
  # comparatives and superlatives (plus grand que, aussi vite que, meilleur, le plus beau)
  comparative:
    type: pattern
    pattern: "\\b(plus|moins|aussi|autant)\\s+(de\\s+|d')?[\\w'-]+\\s+(que|qu')|\\b(meilleur|meilleure|meilleurs|meilleures|pire|pires)\\b|\\b(le|la|les)\\s+(plus|moins)\\b|\\bautant\\s+que\\b"
  # relative pronouns dont and lequel (le livre dont je parle, la raison pour laquelle)
  "relative:dont": {type: words, words: [dont]}
  "relative:lequel":
    type: words
    words: [lequel, laquelle, lesquels, lesquelles, auquel, auxquels, auxquelles, duquel, desquels, desquelles]
  # irregular subjunctives (sois, aie, aille, fasse, puisse, sache, veuille, vienne)
  "irregular:subjonctif": {type: irregular_tense, tense: subjonctif}
  # hypotheses: si + imparfait / plus-que-parfait with a conditional (si j'avais le temps, je viendrais)
  si_clause:
    type: pattern
    annotate: true
    pattern: "(^|[\\s'\"«])(si|s')\\{\\}(?:[^.!?;]|\\.(?=[a-z/_]+\\}))*\\{(imparfait|plus_que_parfait)\\.(?:[^.!?;]|\\.(?=[a-z/_]+\\}))*\\{(conditionnel|conditionnel_passe)\\.|\\{(conditionnel|conditionnel_passe)\\.(?:[^.!?;]|\\.(?=[a-z/_]+\\}))*\\s(si|s')\\{\\}(?:[^.!?;]|\\.(?=[a-z/_]+\\}))*\\{(imparfait|plus_que_parfait)\\."
  # the passive: être + participle (la maison a été construite, il est aimé de tous)
  passive:
    type: pattern
    annotate: true
    pattern: "\\b(suis|es|est|sommes|êtes|sont|étais|était|étions|étiez|étaient|serai|seras|sera|serons|serez|seront|serais|serait|serions|seriez|seraient|sois|soit|soyons|soyez|soient|être|été|étant|fut|furent)\\{[^}]*\\}\\s+([^\\s{]+\\{\\}\\s+){0,2}[^\\s{]+\\{participle\\._\\}"
  # the gérondif and the present participle (en marchant, étant donné)
  gerund: {type: nonfinite, form: gerund}
  # irregular passé simple (fut, eut, fit, dit, prit, vint, mit, put, sut, vit)
  "irregular:passe_simple": {type: irregular_tense, tense: passe_simple}

# Time adverbs (whole words, case-insensitive) and the tenses they fit. The app never rewrites a
# sentence with one of these into another tense (transform exercise: no *Hier je mange).
time_adverbs:
  maintenant: [present]
  actuellement: [present]
  en ce moment: [present]
  de nos jours: [present]
  aujourd'hui: [present, passe_compose, futur]
  hier: [passe_compose, imparfait, plus_que_parfait, passe_simple]
  avant-hier: [passe_compose, imparfait, plus_que_parfait, passe_simple]
  hier soir: [passe_compose, imparfait, plus_que_parfait, passe_simple]
  dernier: [passe_compose, imparfait, plus_que_parfait, passe_simple]
  dernière: [passe_compose, imparfait, plus_que_parfait, passe_simple]
  autrefois: [imparfait, passe_compose, passe_simple]
  jadis: [imparfait, passe_compose, passe_simple]
  à l'époque: [imparfait, passe_compose, plus_que_parfait]
  quand j'étais petit: [imparfait, passe_compose]
  quand j'étais petite: [imparfait, passe_compose]
  d'habitude: [present, imparfait]
  souvent: [present, imparfait, passe_compose, futur]
  demain: [present, futur, futur_anterieur]
  après-demain: [present, futur, futur_anterieur]
  prochain: [present, futur, futur_anterieur]
  prochaine: [present, futur, futur_anterieur]
  bientôt: [present, futur, futur_anterieur]
  plus tard: [present, futur, futur_anterieur]
  dans un an: [present, futur, futur_anterieur]
  ce soir: [present, futur, passe_compose]
  déjà: [present, passe_compose, plus_que_parfait, futur_anterieur]
  jamais: [present, passe_compose, imparfait, futur, plus_que_parfait]
  toujours: [present, passe_compose, imparfait, futur]
  depuis: [present, imparfait]

units:
  - id: u1
    title: {en: Basics}
    skills:
      - id: greetings
        kind: vocab
        title: {en: Greetings}
        icon: wave
        items: {tags: [greetings]}
      - id: little-words
        kind: vocab
        title: {en: Little words}
        icon: chat
        requires: [greetings]
        items: {tags: [little]}
      - id: people
        kind: vocab
        title: {en: People}
        icon: people
        requires: [greetings]
        items: {tags: [people]}
      - id: etre-avoir
        kind: grammar
        title: {en: "Être and avoir"}
        icon: key
        requires: [little-words, people]
        verbs: {lemmas: [être, avoir], tense: present}
        exercises: [conj_grid, cloze, spot_error, transform, multiple_choice]

  - id: u2
    title: {en: The present tense}
    skills:
      - id: present-er
        kind: grammar
        title: {en: "Present of -er verbs: je parle"}
        icon: verb
        requires: [etre-avoir]
        verbs: {tense: present, lemmas: [parler, aimer, regarder, chercher, trouver, donner, travailler, écouter,
                                          demander, penser, habiter, arriver, entrer, rester, oublier, jouer,
                                          marcher, manger]}
        exercises: [conj_pick, conj_grid, cloze, spot_error, transform]
      - id: food
        kind: vocab
        title: {en: Food and drink}
        icon: food
        requires: [etre-avoir]
        items: {tags: [food]}
      - id: articles
        kind: grammar
        title: {en: "Articles: le, la, un, du"}
        icon: article
        requires: [food]
        facet: article
        items: {tags: [gender]}
      - id: numbers
        kind: vocab
        title: {en: Numbers}
        icon: numbers
        requires: [etre-avoir]
        items: {tags: [numbers]}
      - id: present-ir-re
        kind: grammar
        title: {en: "Present of -ir and -re verbs: je finis, je vends"}
        icon: verb
        requires: [present-er]
        verbs: {tense: present, lemmas: [finir, choisir, réussir, réfléchir, grandir, remplir, vendre, attendre,
                                          entendre, répondre, perdre, rendre, descendre, défendre]}
        exercises: [conj_pick, conj_grid, cloze, spot_error, transform]
      - id: negation
        kind: grammar
        title: {en: "Negation: ne ... pas, jamais, rien"}
        icon: grammar
        requires: [present-er, articles]
        introduces: [negation]
        items: {tags: [negation]}

  - id: u3
    title: {en: Everyday life}
    skills:
      - id: time
        kind: vocab
        title: {en: Time and days}
        icon: clock
        requires: [present-ir-re, negation]
        items: {tags: [time]}
      - id: home
        kind: vocab
        title: {en: At home}
        icon: home
        requires: [present-ir-re, negation]
        items: {tags: [home]}
      - id: family
        kind: vocab
        title: {en: Family}
        icon: family
        requires: [time]
        items: {tags: [family]}
      - id: everyday-verbs
        kind: vocab
        title: {en: Everyday verbs}
        icon: verb
        requires: [home]
        items: {tags: [verbs1]}
      - id: irregular-present
        kind: grammar
        title: {en: "Irregular verbs: je vais, je fais, je viens"}
        icon: bolt
        requires: [present-ir-re, negation]
        verbs: {tense: present, lemmas: [aller, faire, venir, prendre, dire, voir, mettre, partir, sortir, dormir,
                                          lire, écrire, boire, connaître, croire]}
        exercises: [conj_grid, cloze, spot_error, transform]
      - id: modal-verbs
        kind: grammar
        title: {en: "Pouvoir, vouloir, devoir, savoir"}
        icon: key
        requires: [irregular-present]
        introduces: [modal]
        verbs: {tense: present, lemmas: [pouvoir, vouloir, devoir, savoir]}
        exercises: [conj_grid, cloze, spot_error, transform]
      - id: questions
        kind: grammar
        title: {en: "Questions: est-ce que, inversion"}
        icon: question
        requires: [irregular-present]
        introduces: [inversion]
        items: {tags: [questions]}

  - id: u4
    title: {en: Describing things}
    skills:
      - id: adjectives
        kind: grammar
        title: {en: "Adjectives: petit, petite, petits"}
        icon: grammar
        requires: [modal-verbs, questions]
        items: {tags: [adjectives]}
        inflections: {table: agreement}
      - id: colours
        kind: vocab
        title: {en: Colours}
        icon: colors
        requires: [adjectives]
        items: {tags: [colours]}
        inflections: {table: agreement}
      - id: adverbs
        kind: vocab
        title: {en: Useful adverbs}
        icon: star
        requires: [modal-verbs, questions]
        items: {tags: [adverbs]}
      - id: possessives
        kind: grammar
        title: {en: "Mon, ton, son: possessives"}
        icon: person
        requires: [adjectives, family]
        items: {tags: [possessives]}
        inflections: {table: agreement}
      - id: demonstratives
        kind: grammar
        title: {en: "Ce, cette, celui-ci: demonstratives"}
        icon: grammar
        requires: [possessives]
        items: {tags: [demonstratives]}
      - id: plurals
        kind: grammar
        title: {en: "Plurals: chevaux, yeux, bijoux"}
        icon: grammar
        requires: [adjectives]
        facet: infl
        inflections: {table: number}
        items: {pos: noun, tags: [plurals]}

  - id: u5
    title: {en: Around town}
    skills:
      - id: city
        kind: vocab
        title: {en: In the city}
        icon: city
        requires: [demonstratives, plurals, colours]
        items: {tags: [city]}
      - id: travel
        kind: vocab
        title: {en: Travel}
        icon: travel
        requires: [demonstratives, plurals, colours]
        items: {tags: [travel]}
      - id: prepositions
        kind: grammar
        title: {en: "Prepositions: à, de, chez, en, au"}
        icon: grammar
        requires: [city, travel]
        items: {tags: [prepositions]}
      - id: near-future
        kind: grammar
        title: {en: "Je vais partir, je viens d'arriver"}
        icon: future
        requires: [prepositions]
        introduces: [futur_proche, venir_de]
        items: {tags: [near-future]}

  - id: u6
    title: {en: Pronouns}
    skills:
      - id: work
        kind: vocab
        title: {en: Work and school}
        icon: work
        requires: [near-future]
        items: {tags: [work]}
      - id: pronouns
        kind: grammar
        title: {en: "Object pronouns: le, la, lui, leur"}
        icon: person
        requires: [near-future]
        items: {tags: [pronouns]}
      - id: y-en
        kind: grammar
        title: {en: "Y and en: j'y vais, j'en veux"}
        icon: grammar
        requires: [pronouns]
        introduces: ["pronoun:y", "pronoun:en"]
        items: {tags: [y-en], min: 3}
      - id: combined-pronouns
        kind: grammar
        title: {en: "Two pronouns: il me le donne"}
        icon: grammar
        requires: [y-en]
        introduces: ["pronoun:combined"]
        items: {tags: [combined]}

  - id: u7
    title: {en: The past}
    skills:
      - id: passe-compose
        kind: grammar
        title: {en: "The passé composé: j'ai parlé"}
        icon: past
        requires: [combined-pronouns, work]
        verbs: {tense: passe_compose, lemmas: [parler, aimer, regarder, chercher, trouver,
                                                                          donner, travailler, écouter, demander, penser,
                                                                          manger, oublier, finir, choisir, attendre,
                                                                          perdre, répondre, vendre]}
        exercises: [conj_grid, cloze, spot_error, transform]
      - id: participles-irregular
        kind: grammar
        title: {en: "Irregular participles: fait, dit, pris, vu"}
        icon: past
        requires: [passe-compose]
        introduces: ["irregular:passe_compose"]
        verbs: {tense: passe_compose, lemmas: [être, avoir, faire, dire, prendre, voir, mettre, écrire, lire, boire,
                                                connaître, croire, pouvoir, vouloir, devoir, savoir, ouvrir, recevoir]}
        exercises: [conj_grid, cloze, spot_error, transform]
      - id: passe-compose-etre
        kind: grammar
        title: {en: "With être: je suis allé, elle est partie"}
        icon: past
        requires: [participles-irregular]
        introduces: ["aux:etre", agreement]
        verbs: {tense: passe_compose, lemmas: [aller, venir, arriver, partir, sortir, entrer, rentrer, rester, tomber,
                                                monter, descendre, naître, mourir, devenir, retourner, revenir]}
        exercises: [conj_grid, cloze, spot_error, transform]

  - id: u8
    title: {en: Memories}
    skills:
      - id: imparfait
        kind: grammar
        title: {en: "The imparfait: je parlais, j'étais"}
        icon: past
        requires: [passe-compose-etre]
        verbs: {tense: imparfait, lemmas: [être, avoir, faire, aller, parler, aimer, habiter, penser, pouvoir, vouloir,
                                            savoir, devoir, venir, prendre, finir, connaître, croire, voir]}
        exercises: [conj_pick, conj_grid, cloze, spot_error, transform]
      - id: narration
        kind: grammar
        title: {en: "Imparfait or passé composé? Telling a story"}
        icon: book
        requires: [imparfait]
        items: {tags: [narration]}
      - id: more-verbs
        kind: vocab
        title: {en: More verbs}
        icon: verb
        requires: [imparfait]
        items: {tags: [verbs2]}
      - id: people-2
        kind: vocab
        title: {en: People and relationships}
        icon: people
        requires: [imparfait]
        items: {tags: [people2]}

  - id: u9
    title: {en: Daily routine}
    skills:
      - id: reflexive
        kind: grammar
        title: {en: "Reflexive verbs: je me lève"}
        icon: person
        requires: [narration, more-verbs]
        introduces: [reflexive]
        verbs: {tense: present, lemmas: [lever, coucher, laver, habiller, réveiller, promener, appeler, reposer,
                                          dépêcher, amuser, marier, souvenir]}
        exercises: [conj_grid, cloze, spot_error, transform]
      - id: reflexive-past
        kind: grammar
