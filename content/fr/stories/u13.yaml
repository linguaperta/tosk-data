    - {fr: "« Tu devrais parler à ton patron. »", en: "\"You should talk to your boss.\""}
    - {fr: "« Il pourrait peut-être te proposer un autre projet. »", en: "\"Maybe he could offer you another project.\""}
    - {fr: "Mais Thomas n'est pas d'accord : « Je préférerais partir. »", en: "But Thomas doesn't agree: \"I'd rather leave.\""}
