- id: u5-paris
  unit: u5
  title: {fr: "Un week-end à Paris", en: "A weekend in Paris"}
  sentences:
    - {fr: "Thomas et Léa vont visiter Paris.", en: "Thomas and Léa are going to visit Paris."}
    - {fr: "Ils prennent le train à la gare de Lyon.", en: "They take the train at Lyon station."}
    - {fr: "L'hôtel est près de la gare, à côté d'une boulangerie.", en: "The hotel is near the station, next to a bakery."}
    - {fr: "À Paris, ils vont au musée et dans un grand parc.", en: "In Paris they go to the museum and to a big park."}
    - {fr: "Le soir, ils mangent dans un restaurant du quartier.", en: "In the evening they eat in a local restaurant."}
    - {fr: "Demain, ils vont prendre le métro jusqu'à la mairie.", en: "Tomorrow they are going to take the underground to the town hall."}
    - {fr: "Mais ils viennent d'arriver et ils sont déjà fatigués !", en: "But they have just arrived and they are already tired!"}
