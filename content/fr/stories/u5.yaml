      answer: 0
    - q: {en: "How do they feel?"}
      options: [{en: "Tired"}, {en: "Hungry"}, {en: "Sad"}]
      answer: 0

- id: u5-route
  unit: u5
  title: {fr: "Sur la route", en: "On the road"}
  sentences:
    - {fr: "Ce matin, Pierre va vers la mer en voiture.", en: "This morning, Pierre is driving towards the sea."}
    - {fr: "Sur la route, il y a beaucoup de voitures.", en: "There are a lot of cars on the road."}
    - {fr: "Il est en retard : ses amis attendent à la plage.", en: "He is late: his friends are waiting at the beach."}
    - {fr: "Au feu, il prend à gauche.", en: "At the traffic lights he turns left."}
    - {fr: "Puis il va tout droit vers le village.", en: "Then he goes straight on towards the village."}
    - {fr: "Ses amis sont devant un café, près de la plage.", en: "His friends are in front of a café, near the beach."}
    - {fr: "« Salut, Pierre ! Tu vas manger avec nous ? »", en: "\"Hi, Pierre! Are you going to eat with us?\""}
