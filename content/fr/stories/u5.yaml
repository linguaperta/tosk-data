      options: [{en: "To the sea"}, {en: "To the mountains"}, {en: "To Paris"}]
      answer: 0
    - q: {en: "Why is Pierre in a hurry?"}
      options: [{en: "He is late"}, {en: "He is hungry"}, {en: "The café is closing"}]
      answer: 0
    - q: {en: "Where are his friends?"}
