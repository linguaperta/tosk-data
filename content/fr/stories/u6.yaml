  title: {fr: "Le nouveau travail", en: "The new job"}
  sentences:
    - {fr: "Julie commence un nouveau travail dans une entreprise.", en: "Julie is starting a new job in a company."}
    - {fr: "Son patron est un homme très gentil.", en: "Her boss is a very kind man."}
    - {fr: "Il lui explique le projet.", en: "He explains the project to her."}
    - {fr: "Julie ne comprend pas tout, alors elle parle à une collègue.", en: "Julie doesn't understand everything, so she talks to a colleague."}
    - {fr: "La collègue le lui explique encore.", en: "The colleague explains it to her again."}
    - {fr: "Elle a beaucoup de travail, mais elle en est contente.", en: "She has a lot of work, but she is happy with it."}
    - {fr: "Demain, elle y va à huit heures.", en: "Tomorrow she goes there at eight."}
