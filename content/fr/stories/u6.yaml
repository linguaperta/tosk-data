    - {fr: "Lucas a un examen de français demain.", en: "Lucas has a French exam tomorrow."}
    - {fr: "Il étudie dans sa chambre avec un ami.", en: "He is studying in his room with a friend."}
    - {fr: "Son ami lui donne des exemples.", en: "His friend gives him examples."}
    - {fr: "Lucas fait beaucoup d'erreurs, mais il veut réussir.", en: "Lucas makes a lot of mistakes, but he wants to pass."}
    - {fr: "« Tu as un stylo ? — Oui, j'en ai deux. »", en: "\"Do you have a pen?\" \"Yes, I have two.\""}
    - {fr: "« Tu peux me le donner ? »", en: "\"Can you give it to me?\""}
    - {fr: "Le professeur va expliquer les réponses après l'examen.", en: "The teacher is going to explain the answers after the exam."}
  questions:
