  title: {fr: "Quand j'étais petit", en: "When I was little"}
  sentences:
    - {fr: "Quand j'étais petit, j'habitais à la campagne.", en: "When I was little, I lived in the country."}
    - {fr: "Mes grands-parents avaient une grande maison.", en: "My grandparents had a big house."}
    - {fr: "Tous les jours, je jouais dans le jardin avec mon frère.", en: "Every day I played in the garden with my brother."}
    - {fr: "Le dimanche, nous allions au marché avec notre grand-mère.", en: "On Sundays we went to the market with our grandmother."}
    - {fr: "Elle connaissait tous les gens du village.", en: "She knew all the people in the village."}
    - {fr: "Un jour, mon frère est tombé dans l'escalier.", en: "One day my brother fell down the stairs."}
    - {fr: "Notre mère est venue tout de suite.", en: "Our mother came straight away."}
