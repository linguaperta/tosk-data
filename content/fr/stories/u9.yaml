- id: u9-matin
  unit: u9
  title: {fr: "Un matin difficile", en: "A difficult morning"}
  sentences:
    - {fr: "Ce matin, Paul ne s'est pas réveillé à l'heure.", en: "This morning Paul didn't wake up on time."}
    - {fr: "Il s'est levé à huit heures.", en: "He got up at eight o'clock."}
    - {fr: "Il s'est lavé très vite et il s'est habillé.", en: "He washed very quickly and got dressed."}
    - {fr: "Il n'a pas eu le temps de manger.", en: "He didn't have time to eat."}
    - {fr: "Il s'est dépêché pour prendre le bus.", en: "He hurried to catch the bus."}
    - {fr: "Au bureau, le patron lui a dit : « Vous êtes en retard, comme d'habitude ! »", en: "At the office the boss said to him: \"You're late, as usual!\""}
    - {fr: "Paul est allé à son bureau sans dire un mot.", en: "Paul went to his desk without saying a word."}
  questions:
    - q: {en: "When did Paul get up?"}
      options: [{en: "At eight"}, {en: "At six"}, {en: "At noon"}]
      answer: 0
    - q: {en: "Did Paul eat breakfast?"}
      options: [{en: "No, he didn't have time"}, {en: "Yes, at home"}, {en: "Yes, on the bus"}]
      answer: 0
    - q: {en: "What did the boss say?"}
      options: [{en: "That he was late, as usual"}, {en: "That he was early"}, {en: "That he could go home"}]
      answer: 0

- id: u9-soiree
