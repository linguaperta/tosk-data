  title: {fr: "Une belle soirée", en: "A lovely evening"}
  sentences:
    - {fr: "Samedi, Léa et ses amis se sont promenés en ville.", en: "On Saturday Léa and her friends went for a walk in town."}
    - {fr: "Le soir, ils ont mangé chez Camille.", en: "In the evening they ate at Camille's."}
    - {fr: "Ils se sont beaucoup amusés.", en: "They had a lot of fun."}
    - {fr: "Ils se sont couchés très tard.", en: "They went to bed very late."}
    - {fr: "Dimanche, Léa s'est reposée à la maison.", en: "On Sunday Léa rested at home."}
    - {fr: "Elle se souvient encore de cette soirée.", en: "She still remembers that evening."}
    - {fr: "Maintenant, ils se voient chaque samedi.", en: "Now they see each other every Saturday."}
  questions:
    - q: {en: "Where did they eat on Saturday evening?"}
      options: [{en: "At Camille's"}, {en: "In a restaurant"}, {en: "At Léa's"}]
      answer: 0
    - q: {en: "What did Léa do on Sunday?"}
      options: [{en: "She rested at home"}, {en: "She went to work"}, {en: "She went for a walk"}]
      answer: 0
    - q: {en: "How often do the friends meet now?"}
      options: [{en: "Every Saturday"}, {en: "Every day"}, {en: "Once a month"}]
      answer: 0
