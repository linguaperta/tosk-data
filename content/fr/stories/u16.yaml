- id: u16-jeu
  unit: u16
  title: {fr: "Et si on gagnait ?", en: "What if we won?"}
  sentences:
    - {fr: "Paul et Claire jouent à un jeu à la télé.", en: "Paul and Claire are playing a game on TV."}
    - {fr: "« Si nous gagnions, qu'est-ce que tu ferais ? »", en: "\"If we won, what would you do?\""}
    - {fr: "« J'achèterais une maison magnifique près de la mer. »", en: "\"I'd buy a magnificent house near the sea.\""}
    - {fr: "« Moi, je voyagerais dans le monde entier. »", en: "\"I would travel all over the world.\""}
    - {fr: "« Et si nous perdions ? — Nous aurions perdu deux euros ! »", en: "\"And if we lost?\" \"We would have lost two euros!\""}
    - {fr: "Ils n'ont rien gagné, mais la soirée a été très agréable.", en: "They won nothing, but the evening was very pleasant."}
    - {fr: "C'est dommage qu'ils n'aient pas gagné !", en: "It's a shame they didn't win!"}
