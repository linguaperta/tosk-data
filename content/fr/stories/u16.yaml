      options: [{en: "A house near the sea"}, {en: "A car"}, {en: "A boat"}]
      answer: 0
    - q: {en: "What would the other one do?"}
      options: [{en: "Travel all over the world"}, {en: "Stop working"}, {en: "Buy a restaurant"}]
