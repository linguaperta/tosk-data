# Curated vocabulary for the French course (input for `python -m pipeline import fr`).
# tags put an item in a vocab skill (course.yaml); en glosses written here are Claude-authored (marked
# tr_src: claude in the lexicon). Items without en take their English gloss from Wiktionary. Entries
# without tags only add/override glosses for automatically selected items (verbs of the grammar skills).
# `aux` overrides a verb's perfect auxiliaries, primary first: verbs taught as reflexives take être
# (je me suis levé) and keep avoir (j'ai levé la main); verbs of motion take avoir with an object
# (j'ai sorti la poubelle).
exclude: [allez/intj, si/intj, bon/intj, bien/intj, quoi/intj, comment/intj, alors/intj, tiens/intj, voyons/intj,
          allons/intj, dis/intj, écoute/intj, attends/intj, arrête/intj, regarde/intj, voilà/intj, ça/intj, oh/intj, est-il, est-ce, a-t-il, y'a, belle/noun, bonne/noun, folle/noun, grosse/noun, histoires/noun, la/noun, première/noun, mes/det, sa/det,
          ses/det, ta/det, tes/det, nouvelles/noun, une/noun, pas/noun, est/adj, a/noun, son/noun, sens/verb, fils/noun, as/noun, vis/noun, point/adv,
          mal/adj, bien/noun, tout/noun, rien/noun, avions/noun, être/noun, avoir/noun, pouvoir/noun, devoir/noun,
          savoir/noun, dîner/verb, déjeuner/verb, souper/verb, goûter/verb, sortie/verb, cours/verb, mort/verb, fait/adj,
          dit/adj, pris/adj, vu/prep, faute/verb, vide/verb, tue/adj, sois/noun, soit/conj, ouais, putain, merde, con,
          connard, salope, bordel, foutre, baiser, chier, enculé, pute, nique, niquer, bite, couille, cul]
# Tatoeba sentences the native review (tosk/docs/samples/fr_exercises.txt) found wrong or odd.
exclude_sentences: [
    # 'quoique' for 'quoi que' (quoi que ce soit, quoi que tu fasses)
    1684378, 5317116, 1638782, 11502524, 891000, 6914994, 6914995, 545159, 1017080, 1642900, 2124224,
    5783127, 5783128, 6382191, 8608430, 8636306,
    # 'Vas vite' (imperative without s), a missing subject ('si serais resté'), 'de l'espèce' for cash
    6864242, 5802179, 8676195,
    # translations that do not match (the boat on the route, the professor and the piece)
    12657489, 431297]
# The imperfect subjunctive (qu'il fût, qu'il eût, parlât) is literary and not taught: sentences with
# such forms are not imported. Every other mood is in the tables.
exclude_moods: [imperfect-subjunctive]
# Quebec and slang spellings (another variety or register): sentences with them are not imported.
exclude_words: [chu, chuis, icitte, astheure, tsé, pantoute, chum, magasiner, kif, ouf, meuf, keuf, relou, chelou,
                zarbi, ouais, nan, kiffer, kiffe, ptit, "p'tit", "p'tite", "y'a", "j'suis", chais, chépa]
# Mass nouns and nouns without a usual plural: no plural in the lexicon, so the app never asks for one.
uncountable: [lait, pain, beurre, sel, sucre, riz, viande, eau, café, thé, vin, bière, fromage, argent, temps, monde,
              courage, patience, peur, faim, soif, sommeil, santé, chance, sang, musique, nature, pluie, neige,
              chaleur, froid, vent, soleil, bonheur, jeunesse, vieillesse, enfance, silence, paix, justice, liberté,
              confiance, respect, électricité, essence, farine, huile, poivre, miel, chocolat, confiture,
              lessive, vaisselle, ménage, courrier, pollution, police, publicité, sida, oxygène, or, fer]
