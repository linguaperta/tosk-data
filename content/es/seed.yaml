# Curated vocabulary for the Spanish course (input for `python -m pipeline import es`).
# tags put an item in a vocab skill; nl/en glosses written here are Claude-authored
# (marked tr_src: claude in the lexicon). Items without en take their English gloss from
# Wiktionary. Entries without tags only add/override glosses for automatically selected items
# (verbs of the grammar skills).
exclude: []
# Mass nouns and abstract nouns whose plural is odd or means something else: no plural in the
# lexicon, so the app never asks for or offers one.
uncountable: [leche, arroz, azúcar, sal, carne, gente, dinero, sed, hambre, salud, sangre, música, ropa, té,
              chocolate, policía, naturaleza, lluvia, nieve, calor, suerte, miedo, tiempo, alegría, comida, fruta,
              agua, café, fútbol, ganas, gafas, vacaciones, fiebre, medicina, cariño]
