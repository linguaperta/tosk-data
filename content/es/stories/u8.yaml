  sentences:
    - {es: "Ayer Juan recibió una carta de su abuela.", en: "Yesterday Juan received a letter from his grandmother.", nl: "Gisteren kreeg Juan een brief van zijn oma."}
    - {es: "La abrió en la cocina y la leyó otra vez.", en: "He opened it in the kitchen and read it again.", nl: "Hij maakte hem open in de keuken en las hem nog een keer."}
    - {es: "Su abuela le escribió sobre su pueblo.", en: "His grandmother wrote to him about her village.", nl: "Zijn oma schreef hem over haar dorp."}
    - {es: "Juan decidió visitarla.", en: "Juan decided to visit her.", nl: "Juan besloot haar te bezoeken."}
    - {es: "El sábado tomó el autobús hasta el pueblo.", en: "On Saturday he took the bus to the village.", nl: "Zaterdag nam hij de bus naar het dorp."}
    - {es: "Su abuela abrió la puerta y no dijo nada.", en: "His grandmother opened the door and didn't say anything.", nl: "Zijn oma deed de deur open en zei niets."}
    - {es: "Después le dio un abrazo muy fuerte.", en: "Then she gave him a very big hug.", nl: "Daarna gaf ze hem een heel stevige knuffel."}
