    - {es: "Juan no encuentra la llave.", en: "Juan can't find the key.", nl: "Juan vindt de sleutel niet."}
    - {es: "Busca en la cocina y en el baño.", en: "He looks in the kitchen and in the bathroom.", nl: "Hij zoekt in de keuken en in de badkamer."}
    - {es: "No está encima de la mesa.", en: "It isn't on the table.", nl: "Hij ligt niet op tafel."}
    - {es: "Tampoco está debajo de la cama.", en: "It isn't under the bed either.", nl: "Hij ligt ook niet onder het bed."}
    - {es: "La hija de Juan encuentra la llave.", en: "Juan's daughter finds the key.", nl: "De dochter van Juan vindt de sleutel."}
    - {es: "La llave está en la puerta.", en: "The key is in the door.", nl: "De sleutel zit in de deur."}
    - {es: "Juan dice: «¡Gracias!»", en: "Juan says: \"Thanks!\"", nl: "Juan zegt: \"Bedankt!\""}
