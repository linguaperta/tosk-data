# Curated vocabulary for the Italian course (input for `python -m pipeline import it`).
# tags put an item in a vocab skill; nl/en glosses written here are Claude-authored
# (marked tr_src: claude in the lexicon). Items without en take their English gloss from
# Wiktionary. Entries without tags only add/override glosses for automatically selected items.
# Words never taken into the automatic frequency pool (Wiktionary homographs and inflected
# forms that inherit a misleading frequency): lemma or lemma/pos.
exclude: [coso, chiama/noun, bastardo, troia, scopare, puttana, alla/prep, prestare, liberare, voltare, scorrere, sulla/noun, fossa, ti/noun, mi/noun, di/noun, si/noun, la/noun, neo, serva/noun, andata/noun, volto/adj, para/noun, stia/noun, sola/noun, unica/noun, fatta/noun, piccola/noun, nuova/noun, sicura/noun, bella/noun, tuoi/noun, miei/noun, suoi/noun, giorni/noun, mani/noun, dimmi, ha/intj, essere/noun, avere/noun, dire/noun, credo/noun, era/noun, fata/noun, visto/noun]
# Tatoeba sentences a review found wrong or odd (Tatoeba ids): 'stare + essendo' (Io sto solo essendo
# educato) and "assumere che" (Assumo che tu conosca Tom: I take it) are anglicisms.
exclude_sentences: [2736271, 2736273, 2736279, 2736281, 2736355, 2736357, 2736359, 2736361, 2755185, 3322449, 8901089]
# Mass nouns and abstract nouns whose plural is odd, invariable or means something else (burri, risa =
# laughter, saluti = greetings, radi, euri): no plural in the lexicon, so the app never asks for or offers one.
uncountable: [latte, burro, sale, zucchero, pepe, riso, aglio, olio, frutta, pane, fame, sete, sangue, salute,
              tristezza, rabbia, pace, polizia, aria, natura, nebbia, neve, sole, denaro, musica, autunno, primavera,
              gente, radio, euro, cioccolato]
