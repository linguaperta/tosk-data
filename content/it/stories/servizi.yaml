- id: u10-banca
  unit: servizi-u1
  title: {it: "In banca", en: "At the bank"}
  sentences:
    - {it: "Sara deve pagare l'affitto e va in banca.", en: "Sara has to pay the rent and goes to the bank."}
    - {it: "Davanti allo sportello c'è una lunga fila.", en: "There is a long queue in front of the counter."}
    - {it: "Sara si siede e aspetta.", en: "Sara sits down and waits."}
    - {it: "Dopo venti minuti un impiegato la chiama.", en: "After twenty minutes a clerk calls her."}
    - {it: "Sara compila un modulo e firma.", en: "Sara fills in a form and signs."}
    - {it: "Poi vede che non ha la carta di credito.", en: "Then she sees that she doesn't have her credit card."}
    - {it: "Si arrabbia, ma l'impiegato è gentile e la aiuta.", en: "She gets angry, but the clerk is kind and helps her."}
  questions:
    - q: {en: "Why does Sara go to the bank?"}
      options: [{en: "To pay the rent"}, {en: "To open an account"}, {en: "To meet a friend"}]
      answer: 0
    - q: {en: "What is there in front of the counter?"}
      options: [{en: "A long queue"}, {en: "A sofa"}, {en: "A cash machine"}]
      answer: 0
    - q: {en: "What does she fill in?"}
      options: [{en: "A form"}, {en: "A letter"}, {en: "A receipt"}]
      answer: 0
    - q: {en: "What doesn't she have?"}
      options: [{en: "Her credit card"}, {en: "Her passport"}, {en: "Her phone"}]
      answer: 0

- id: u11-stazione
  unit: servizi-u2
  title: {it: "Dov'è la stazione?", en: "Where is the station?"}
  sentences:
    - {it: "Buongiorno, dov'è la stazione?", en: "Good morning, where is the station?"}
    - {it: "Vada dritto fino al semaforo.", en: "Go straight on as far as the traffic lights."}
    - {it: "Al semaforo, giri a destra.", en: "At the traffic lights, turn right."}
    - {it: "Attraversi la piazza.", en: "Cross the square."}
    - {it: "La stazione è a sinistra, di fronte al parco.", en: "The station is on the left, opposite the park."}
    - {it: "È lontano?", en: "Is it far?"}
    - {it: "No, sono dieci minuti a piedi.", en: "No, it's ten minutes on foot."}
    - {it: "Grazie mille, buona giornata!", en: "Thanks a lot, have a nice day!"}
  questions:
    - q: {en: "What should he do at the traffic lights?"}
      options: [{en: "Turn right"}, {en: "Turn left"}, {en: "Stop"}]
      answer: 0
    - q: {en: "Where is the station?"}
      options: [{en: "On the left, opposite the park"}, {en: "Behind the square"}, {en: "On the motorway"}]
      answer: 0
    - q: {en: "How far is it?"}
      options: [{en: "Ten minutes on foot"}, {en: "One hour by bus"}, {en: "Two kilometres"}]
      answer: 0
