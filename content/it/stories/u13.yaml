- id: u13-gita
  unit: u13
  title: {it: "In montagna", en: "In the mountains"}
  sentences:
    - {it: "Oggi stiamo camminando in montagna.", en: "Today we are walking in the mountains."}
    - {it: "Il paesaggio è bellissimo.", en: "The landscape is very beautiful."}
    - {it: "Qui l'aria è più fresca che in città.", en: "Here the air is fresher than in the city."}
    - {it: "In questo bosco si vedono molti animali.", en: "In this wood you can see many animals."}
    - {it: "Mio fratello è più veloce di me e arriva prima.", en: "My brother is faster than me and arrives first."}
    - {it: "Dalla collina si vede il mare.", en: "From the hill you can see the sea."}
    - {it: "È il giorno più bello dell'anno!", en: "It's the best day of the year!"}
