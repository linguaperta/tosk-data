  title: {it: "Se vincessi...", en: "If I won..."}
  sentences:
    - {it: "Marco sogna sempre di diventare ricco.", en: "Marco always dreams of becoming rich."}
    - {it: "Se vincessi, comprerei una casa al mare.", en: "If I won, I would buy a house by the sea."}
    - {it: "Se avessi molti soldi, non lavorerei più.", en: "If I had a lot of money, I wouldn't work any more."}
    - {it: "Sua moglie ride: magari fosse vero!", en: "His wife laughs: if only it were true!"}
    - {it: "Lei pensa che sia meglio risparmiare.", en: "She thinks it is better to save."}
    - {it: "Così mettono i soldi in banca e aspettano.", en: "So they put the money in the bank and wait."}
