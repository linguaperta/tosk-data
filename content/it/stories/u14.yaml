- id: u14-partenza
  unit: u14
  title: {it: "Prima che tu parta", en: "Before you leave"}
  sentences:
    - {it: "Giulia partirà per un lungo viaggio.", en: "Giulia will set off on a long journey."}
    - {it: "Sua madre pensa che il viaggio sia pericoloso.", en: "Her mother thinks the trip is dangerous."}
    - {it: "Suo padre invece crede che sia un'esperienza importante.", en: "Her father, on the other hand, thinks it's an important experience."}
    - {it: "Prima che Giulia parta, fanno una cena insieme.", en: "Before Giulia leaves, they have dinner together."}
    - {it: "Il padre le dice: \"Benché tu sia giovane, sei molto forte.\"", en: "Her father tells her: \"Although you are young, you are very strong.\""}
    - {it: "La madre le chiede di scrivere appena arriva.", en: "Her mother asks her to write as soon as she arrives."}
    - {it: "Giulia sorride: \"Se fosse possibile, vi porterei con me!\"", en: "Giulia smiles: \"If it were possible, I'd take you with me!\""}
  questions:
