    - {it: "\"Ancora dieci minuti!\"", en: "\"Ten more minutes!\"", nl: "\"Nog tien minuten!\""}
    - {it: "Finalmente la zuppa è sul tavolo, con il pane.", en: "Finally the soup is on the table, with the bread.", nl: "Eindelijk staat de soep op tafel, met het brood."}
