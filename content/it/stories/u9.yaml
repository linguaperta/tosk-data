- id: u9-sogno
  unit: u9
  title: {it: "Uno strano sogno", en: "A strange dream", nl: "Een vreemde droom"}
  new_words: [sogno]
  sentences:
    - {it: "Ieri notte Luca ha fatto un sogno strano.", en: "Last night Luca had a strange dream.", nl: "Vannacht had Luca een vreemde droom."}
    - {it: "Volava sopra la città come un uccello.", en: "He was flying over the city like a bird.", nl: "Hij vloog als een vogel boven de stad."}
    - {it: "Sotto di lui vedeva la sua scuola e la casa dei nonni.", en: "Below him he could see his school and his grandparents' house.", nl: "Onder zich zag hij zijn school en het huis van zijn opa en oma."}
    - {it: "Poi è caduto in un lago pieno di pesci.", en: "Then he fell into a lake full of fish.", nl: "Toen viel hij in een meer vol vissen."}
    - {it: "I pesci ridevano e parlavano con lui!", en: "The fish were laughing and talking to him!", nl: "De vissen lachten en praatten met hem!"}
    - {it: "Luca ha provato a rispondere, ma non aveva voce.", en: "Luca tried to answer, but he had no voice.", nl: "Luca probeerde te antwoorden, maar hij had geen stem."}
    - {it: "Poi la mamma lo ha chiamato: era ora di andare a scuola.", en: "Then his mum called him: it was time to go to school.", nl: "Toen riep zijn moeder hem: het was tijd om naar school te gaan."}
    - {it: "A colazione Luca ha raccontato il sogno alla sua famiglia.", en: "At breakfast Luca told his family about the dream.", nl: "Bij het ontbijt vertelde Luca zijn familie over de droom."}
