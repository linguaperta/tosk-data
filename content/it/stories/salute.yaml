    - {it: "Sua madre porta una medicina e un tè caldo.", en: "Her mother brings some medicine and a hot tea.", nl: "Haar moeder brengt een medicijn en een warme thee."}
    - {it: "Anna beve il tè e dorme molto.", en: "Anna drinks the tea and sleeps a lot.", nl: "Anna drinkt de thee en slaapt veel."}
    - {it: "La sera il suo amico Marco telefona.", en: "In the evening her friend Marco phones.", nl: "'s Avonds belt haar vriend Marco."}
    - {it: "\"Come stai?\" \"Sono stanca, ma sto già meglio.\"", en: "\"How are you?\" \"I'm tired, but I'm already better.\"", nl: "\"Hoe gaat het?\" \"Ik ben moe, maar het gaat al beter.\""}
