- id: u5-zuppa
  unit: cucina-u1
  title: {it: "La zuppa della nonna", en: "Grandma's soup", nl: "De soep van oma"}
  sentences:
    - {it: "La nonna di Giulia prepara la sua zuppa.", en: "Giulia's grandmother is making her soup.", nl: "De oma van Giulia maakt haar soep."}
    - {it: "Nella pentola mette l'acqua, l'olio e il sale.", en: "She puts the water, the oil and the salt in the pot.", nl: "In de pan doet ze het water, de olie en het zout."}
    - {it: "Poi mette le carote, la cipolla e l'aglio.", en: "Then she puts in the carrots, the onion and the garlic.", nl: "Dan doet ze de wortels, de ui en de knoflook erin."}
    - {it: "Giulia ha fame e aspetta in cucina.", en: "Giulia is hungry and waits in the kitchen.", nl: "Giulia heeft honger en wacht in de keuken."}
    - {it: "\"Nonna, quando è pronta?\"", en: "\"Grandma, when is it ready?\"", nl: "\"Oma, wanneer is het klaar?\""}
    - {it: "\"Ancora dieci minuti!\"", en: "\"Ten more minutes!\"", nl: "\"Nog tien minuten!\""}
    - {it: "Finalmente la zuppa è sul tavolo, con il pane.", en: "Finally the soup is on the table, with the bread.", nl: "Eindelijk staat de soep op tafel, met het brood."}
    - {it: "È davvero buona!", en: "It's really good!", nl: "Hij is echt lekker!"}
  questions:
    - q: {en: "What is grandma making?", nl: "Wat maakt oma?"}
      prompt: "Che cosa prepara la nonna?"
      options: ["una zuppa", "una torta", "una pizza"]
      answer: 0
    - q: {en: "Which vegetables go into the soup?", nl: "Welke groenten gaan er in de soep?"}
      options: [{en: "Carrots, onion and garlic", nl: "Wortels, ui en knoflook"}, {en: "Potatoes and tomatoes", nl: "Aardappels en tomaten"}, {en: "Only onion", nl: "Alleen ui"}]
      answer: 0
    - q: {en: "How long does Giulia still have to wait?", nl: "Hoe lang moet Giulia nog wachten?"}
      options: [{en: "Ten minutes", nl: "Tien minuten"}, {en: "Five minutes", nl: "Vijf minuten"}, {en: "An hour", nl: "Een uur"}]
      answer: 0

