            items: {tags: [kitchen]}
      - id: cucina-u2
        title: {en: Recipes, nl: Recepten}
        skills:
          - id: food-more
            kind: vocab
            title: {en: Cooking and shopping for food, nl: Koken en boodschappen}
            icon: food
            requires: [kitchen, imperative]
            items: {tags: [food2]}

  # Feelings (unit 6, after the passato prossimo), emotions (unit 12) and character (unit 14).
  - id: emozioni
    title: {en: Feelings and character, nl: Gevoelens en karakter}
