# Italian course for English and Dutch speakers.
# Skills select their items with queries (see tosk/pipeline/pipeline/query.py); the
# compiler resolves them into skill_items/skill_facets, so the app never reads these queries.
#
# Grammar gating (tosk/docs/ARCHITECTURE.md, "Grammar gating"; pipeline/pipeline/features.py):
# a learner never meets a grammar construct before the skill that introduces it. The present tense
# is allowed from the start; every other feature below is introduced by one skill (a verbs skill
# introduces tense:{T} automatically). Each unit's skills require the previous unit's grammar, so
# every later skill allows everything taught before it.
id: it
version: 1.5.0
title: {en: Italian, nl: Italiaans}
description:
  en: Italian from the basics to A2/B1, with a strong focus on verbs, moods and reading.
  nl: Italiaans vanaf de basis tot A2/B1, met veel aandacht voor werkwoorden, wijzen en lezen.
target: it
# English is the source language of the course; the Dutch glosses, translations and notes of units
# 1-9 are kept (owner decision 2026-10-20), later content has English only and the app falls back
# to English where a Dutch text is missing.
translations: [en, nl]
required_translations: [en]
note_langs: [en]
unverified: false
# Apps before topics (0.7.3 and older) would show the topic units at the end of the main tree, with
# prerequisite boughs running from far up the map; their bough painter fails on boughs that long
# (Skia path ops), so they keep their bundled pack (tosk/docs/topic-split.md, "Versions and old apps").
min_app_version: 0.7.4
persons: [io, tu, lui/lei, noi, voi, loro]
person_labels:
  # tu and voi are both English "you": a sentence without a subject pronoun never swaps them
  tu: {en: "tu (you)", nl: "tu (jij)"}
  lui/lei: {en: "lui/lei (he/she)", nl: "lui/lei (hij/zij)"}
  voi: {en: "voi (you, plural)", nl: "voi (jullie)"}
  loro: {en: "loro (they)", nl: "loro (zij, mv.)"}
tenses: [presente, imperfetto, futuro, passato_prossimo, condizionale, congiuntivo_presente,
         congiuntivo_imperfetto, imperativo, passato_remoto]
tense_labels:
  presente: {en: present, nl: tegenwoordige tijd}
  imperfetto: {en: imperfect, nl: onvoltooid verleden tijd}
  futuro: {en: future, nl: toekomende tijd}
  passato_prossimo: {en: present perfect (passato prossimo), nl: voltooid tegenwoordige tijd (passato prossimo)}
  condizionale: {en: conditional (condizionale), nl: voorwaardelijke wijs (condizionale)}
  congiuntivo_presente: {en: present subjunctive (congiuntivo presente), nl: "aanvoegende wijs, tegenwoordig (congiuntivo presente)"}
  congiuntivo_imperfetto: {en: imperfect subjunctive (congiuntivo imperfetto), nl: "aanvoegende wijs, verleden (congiuntivo imperfetto)"}
  imperativo: {en: imperative, nl: gebiedende wijs}
  passato_remoto: {en: simple past (passato remoto), nl: verleden tijd van verhalen (passato remoto)}
# the imperative has no io and no (formal, rare) Loro form; its lui/lei row is the formal Lei
tense_persons:
  imperativo: [tu, lui/lei, noi, voi]
tense_person_labels:
  imperativo:
    tu: {en: "tu (you)", nl: "tu (jij)"}
    lui/lei: {en: "Lei (you, formal)", nl: "Lei (u)"}
    noi: {en: "noi (let's)", nl: "noi (laten we)"}
    voi: {en: "voi (you, plural)", nl: "voi (jullie)"}
# the transform exercise changes the tense only within one group: the indicative tenses (unlisted),
# never into or out of a mood (Mangio -> *Mangi; Se piove resto -> *Se piove resterei)
tense_groups:
  condizionale: conditional
  congiuntivo_presente: subjunctive_present
  congiuntivo_imperfetto: subjunctive_imperfect
  imperativo: imperative
articles: [il, lo, la, "l'"]

# Inflection tables of non-verbs (tosk/docs/ARCHITECTURE.md, "Inflection tables"; the importer
# fills them from Wiktionary, pipeline/pipeline/inflect.py). Skills train them with
# `inflections: {table: T}` (facet #infl:T). `agreement`: the cell follows from the noun, so in a
# sentence every other cell is wrong (una casa bella: bello/belli/belle are wrong options).
inflection_tables:
  number:
    title: {en: singular and plural, nl: enkelvoud en meervoud}
    pos: [noun]
    cells: [sg, pl]
    base: sg
    labels:
      sg: {en: singular, nl: enkelvoud}
      pl: {en: plural, nl: meervoud}
  agreement:
    title: {en: gender and number, nl: geslacht en getal}
    pos: [adj, det]
    cells: [m.sg, f.sg, m.pl, f.pl]
    base: m.sg
    agreement: true
    labels:
      m.sg: {en: masculine singular, nl: mannelijk enkelvoud}
      f.sg: {en: feminine singular, nl: vrouwelijk enkelvoud}
      m.pl: {en: masculine plural, nl: mannelijk meervoud}
      f.pl: {en: feminine plural, nl: vrouwelijk meervoud}

base_features: ["tense:presente"]
feature_detectors:
  # passato prossimo with essere (sono andato): introduced after the avere-perfect
  "aux:essere": {type: compound_aux, aux: essere}
  # potere/dovere/volere/sapere + infinitive (posso venire, devo farlo)
  modal:
    type: modal_infinitive
    verbs: [potere, dovere, volere, sapere]
    infinitive_pattern: "[a-zàèéìòù]+((are|ere|ire|rre)|(ar|er|ir|r)(mi|ti|ci|vi|si|lo|la|li|le|gli|ne|glielo|gliela|melo|mela|telo|tela|celo|cela|velo|vela|sene))"
  # preposition + article (del, nella, all'...)
  "prep:articulated":
    type: words
    words: [del, dello, della, "dell'", dei, degli, delle, al, allo, alla, "all'", ai, agli, alle,
            dal, dallo, dalla, "dall'", dai, dagli, dalle, nel, nello, nella, "nell'", nei, negli, nelle,
            sul, sullo, sulla, "sull'", sui, sugli, sulle, col, coi]
  # irregular future stems (sarò, avrò, andrò, farò, potrò, verrò, ...)
  "irregular:futuro": {type: irregular_tense, tense: futuro}
  # --- units 10-15 (pack 1.3)
  # a reflexive pronoun of the verb's own person (mi alzo, ti sei svegliato, ci vediamo; pronominal
  # verbs like alzarsi align their pronoun to themselves and count too)
  reflexive:
    type: reflexive
    pronouns: {mi: io, ti: tu, ci: noi, vi: voi, si: [lui/lei, loro]}
    clitics: [lo, la, li, le, ne, gli, "l'", me, te, ce, ve, se]
  # impersonal and passive si with a verb that is no pronominal item (si dice, si vendono case)
  si:
    type: reflexive
    pronouns: {si: [lui/lei, loro]}
    clitics: [lo, la, li, le, ne, ci, gli, "l'"]
    unbound: true
  # locative/idiomatic ci with a verb of another person than noi (ci vado, ci penso, non ci riesco)
  ci:
    type: reflexive
    pronouns: {ci: [io, tu, lui/lei, voi, loro]}
    clitics: [lo, la, li, le, ne, "l'", si, mi, ti, vi]
    unbound: true
    verbs: [andare, venire, pensare, credere, riuscire, tornare, stare, mettere, volere, vedere, sentire,
            entrare, arrivare, provare, rimanere, restare, passare, abitare, vivere, contare, giocare, salire]
  # partitive/genitive ne (ne voglio due, ne parliamo, che ne pensi?), not inside andarsene forms
  ne: {type: words, words: [ne, "n'"]}
  # stare + gerund and other gerunds (sto mangiando, studiando si impara, dicendolo)
  gerund:
    type: nonfinite
    form: gerund
    pattern: "[a-zàèéìòù]+(ando|endo)(mi|ti|si|ci|vi|lo|la|li|le|ne|gli|glielo|gliela|gliene|melo|telo|selo|sene)"
  # negative tu imperative: non + infinitive at the start of a clause (Non parlare! Non preoccuparti.)
  # (the words with their aligned forms: 'Non{} ti{} preoccupare{infinitive._}', not 'Non ti diverti?')
  "imperative:negative":
    type: pattern
    annotate: true
    pattern: "(^|[.!?;:,«\"]\\s*)non\\{\\}\\s+((mi|ti|ci|vi|si|lo|la|li|le|ne|gli|me|te|ce|ve|se|l')\\{\\}\\s*)*[a-zàèéìòù']+\\{infinitive\\._\\}"
  # an imperative with attached pronouns (dimmi, fallo, aspettami, parlagli)
  "imperative:pronoun": {type: enclitic, tense: imperativo}
  # irregular imperatives (va', fa', di', sii, abbi, vieni), conditionals (sarei, vorrei),
  # subjunctives (sia, abbia, vada, faccia) and passato remoto forms (fu, ebbe, fece, disse)
  "irregular:imperativo": {type: irregular_tense, tense: imperativo}
  "irregular:condizionale": {type: irregular_tense, tense: condizionale}
  "irregular:congiuntivo_presente": {type: irregular_tense, tense: congiuntivo_presente}
  "irregular:passato_remoto": {type: irregular_tense, tense: passato_remoto}
  # combined pronouns: glielo, me lo, te ne, ce l'ho ... and attached (dammelo, dirglielo)
  "pronoun:combined":
    type: words
    words: [glielo, gliela, glieli, gliele, gliene, "me lo", "me la", "me li", "me le", "me ne", "me l'",
            "te lo", "te la", "te li", "te le", "te ne", "te l'", "ce lo", "ce la", "ce li", "ce le", "ce ne",
            "ce l'", "ve lo", "ve la", "ve li", "ve le", "ve ne", "ve l'", "se lo", "se la", "se li", "se le",
            "se l'"]
  "pronoun:attached":
    type: pattern
    pattern: "\\b[a-zàèéìòù]+(ar|er|ir|r|ando|endo)(glie|me|te|ce|ve|se)(lo|la|li|le|ne)\\b|\\b(da|di|fa|sta|va)(mm|tt|cc)?(glie|me|te|ce|ve)(lo|la|li|le|ne)\\b"
  # comparatives and superlatives (più alto di, meno che, migliore, il più bello, bellissimo)
  comparative:
    type: pattern
    pattern: "\\b(più|meno)\\s+[a-zàèéìòù']+\\s+(di|del|dello|della|dei|degli|delle|dell'|che)\\b|\\b(migliore|migliori|peggiore|peggiori|maggiore|maggiori|minore|minori|peggio)\\b|\\b(il|la|i|le|lo|gli)\\s+(più|meno)\\b|\\b[a-zàèéìòù]{3,}issim[oaie]\\b"
  # relative pronouns cui and il quale (la casa in cui abito, l'uomo del quale parlo)
  relative:
    type: words
    words: [cui, "il quale", "la quale", "i quali", "le quali", "del quale", "della quale", "dei quali",
            "delle quali", "al quale", "alla quale", "ai quali", "alle quali", "nel quale", "nella quale",
            "sul quale", "sulla quale", "dal quale", "dalla quale"]

# Time adverbs (whole words, case-insensitive) and the tenses they fit. The app never rewrites a
# sentence with one of these into another tense (transform exercise: no *Ieri mangio, *Adesso mangiavo).
time_adverbs:
  adesso: [presente]
  ora: [presente]
  attualmente: [presente]
  oggigiorno: [presente]
  in questo momento: [presente]
  al momento: [presente]
  ieri: [passato_prossimo, imperfetto]
  scorso: [passato_prossimo, imperfetto]
  scorsa: [passato_prossimo, imperfetto]
  scorsi: [passato_prossimo, imperfetto]
  scorse: [passato_prossimo, imperfetto]
  poco fa: [passato_prossimo, imperfetto]
  tempo fa: [passato_prossimo, imperfetto]
  anni fa: [passato_prossimo, imperfetto]
  anno fa: [passato_prossimo, imperfetto]
  mesi fa: [passato_prossimo, imperfetto]
  mese fa: [passato_prossimo, imperfetto]
  settimane fa: [passato_prossimo, imperfetto]
  settimana fa: [passato_prossimo, imperfetto]
  giorni fa: [passato_prossimo, imperfetto]
  giorno fa: [passato_prossimo, imperfetto]
  ore fa: [passato_prossimo, imperfetto]
  minuti fa: [passato_prossimo, imperfetto]
  da bambino: [imperfetto, passato_prossimo]
  da bambina: [imperfetto, passato_prossimo]
  da piccolo: [imperfetto, passato_prossimo]
  da piccola: [imperfetto, passato_prossimo]
  da giovane: [imperfetto, passato_prossimo]
  domani: [presente, futuro]
  dopodomani: [presente, futuro]
  domattina: [presente, futuro]
  prossimo: [presente, futuro]
  prossima: [presente, futuro]
  prossimi: [presente, futuro]
  prossime: [presente, futuro]
  fra poco: [presente, futuro]
  tra poco: [presente, futuro]
  in futuro: [presente, futuro]
  di solito: [presente, imperfetto]
  solitamente: [presente, imperfetto]

units:
  - id: u1
    title: {en: Basics, nl: Basis}
    skills:
      - id: greetings
        kind: vocab
        title: {en: Greetings, nl: Begroetingen}
        icon: wave
        items: {tags: [greetings]}
      - id: little-words
        kind: vocab
        title: {en: Little words, nl: Kleine woorden}
        icon: chat
        requires: [greetings]
        items: {tags: [little]}
      - id: people
        kind: vocab
        title: {en: People, nl: Mensen}
        icon: people
        requires: [greetings]
        items: {tags: [people]}
      - id: essere-avere
        kind: grammar
        title: {en: Essere and avere, nl: Essere en avere}
        icon: key
        requires: [little-words, people]
        verbs: {lemmas: [essere, avere], tense: presente}
        exercises: [conj_grid, cloze, spot_error, transform, multiple_choice]

  - id: u2
    title: {en: The present tense, nl: De tegenwoordige tijd}
    skills:
      - id: food
        kind: vocab
        title: {en: Food and drink, nl: Eten en drinken}
        icon: food
        requires: [essere-avere]
        items: {tags: [food]}
      - id: numbers
        kind: vocab
        title: {en: Numbers, nl: Getallen}
        icon: numbers
        requires: [essere-avere]
        items: {tags: [numbers]}
      - id: present-are
        kind: grammar
        title: {en: Present tense of -are verbs, nl: Tegenwoordige tijd van -are-werkwoorden}
        icon: verb
        requires: [essere-avere]
        verbs: {class: are, regular: true, tense: presente, top: 20, exclude: [cambiare]}
        exercises: [conj_pick, conj_grid, cloze, spot_error, transform]
      - id: articles
        kind: grammar
        title: {en: The article, nl: Het lidwoord}
        icon: article
        requires: [food]
        facet: article
        items: {pos: noun, tags: [people, food]}
      - id: present-ere
        kind: grammar
        title: {en: Present tense of -ere verbs, nl: Tegenwoordige tijd van -ere-werkwoorden}
        icon: verb
        requires: [present-are]
        verbs: {class: ere, regular: true, tense: presente, top: 18, exclude: [uccidere, smettere]}
        exercises: [conj_pick, conj_grid, cloze, spot_error, transform]
      - id: present-ire
        kind: grammar
        title: {en: Present tense of -ire verbs, nl: Tegenwoordige tijd van -ire-werkwoorden}
        icon: verb
        requires: [present-ere]
        verbs: {class: [ire, isc], regular: true, tense: presente, top: 18}
        exercises: [conj_pick, conj_grid, cloze, spot_error, transform]

  - id: u3
    title: {en: Everyday life, nl: Het dagelijks leven}
    skills:
      - id: time
        kind: vocab
        title: {en: Time and days, nl: Tijd en dagen}
        icon: clock
        requires: [present-ire]
        items: {tags: [time]}
      - id: home
        kind: vocab
        title: {en: At home, nl: Thuis}
        icon: home
        requires: [present-ire]
        items: {tags: [home]}
      - id: family
        kind: vocab
        title: {en: Family, nl: Familie}
        icon: family
        requires: [time]
        items: {tags: [family]}
      - id: everyday-verbs
        kind: vocab
        title: {en: Everyday verbs, nl: Alledaagse werkwoorden}
        icon: verb
        requires: [home]
        items: {tags: [verbs1]}
      - id: irregular-present
        kind: grammar
        title: {en: Irregular verbs in the present, nl: Onregelmatige werkwoorden in de tegenwoordige tijd}
        icon: bolt
        requires: [present-ire]
        # frozen at the 1.2.0 selection (the frequency query would now pick other verbs)
        verbs: {tense: presente, lemmas: [stare, andare, fare, dire, venire, riuscire, uscire, dare, tenere, morire,
                                          rimanere, bere, ottenere, salire]}
        exercises: [conj_grid, cloze, spot_error, transform]
      - id: pronouns
        kind: grammar
        title: {en: Object pronouns, nl: Voornaamwoorden als lijdend en meewerkend voorwerp}
        icon: person
        requires: [irregular-present]
        items: {tags: [pronouns]}
      - id: modal-verbs
        kind: grammar
        title: {en: "Can, must, want: modal verbs", nl: "Kunnen, moeten, willen: modale werkwoorden"}
        icon: key
        requires: [irregular-present]
        introduces: [modal]
        verbs: {tense: presente, lemmas: [potere, dovere, volere, sapere]}
        exercises: [conj_grid, cloze, spot_error, transform]
      - id: plurals
        kind: grammar
        title: {en: "One and many: plurals", nl: "Een en meer: het meervoud"}
        icon: grammar
        requires: [family, home]
        facet: infl
        inflections: {table: number}      # #infl:number of nouns with a plural (not città, caffè)
        items: {pos: noun, tags: [people, food, home, family], top: 30}

  - id: u4
    title: {en: Describing things, nl: Dingen beschrijven}
    skills:
      - id: adjectives
        kind: grammar
        title: {en: Adjectives, nl: Bijvoeglijke naamwoorden}
        icon: grammar
        requires: [pronouns, modal-verbs]
        items: {tags: [adjectives]}
        inflections: {table: agreement}   # + #infl:agreement (bello, bella, belli, belle)
      - id: adverbs
        kind: vocab
        title: {en: Useful adverbs, nl: Handige bijwoorden}
        icon: star
        requires: [pronouns, modal-verbs]
        items: {tags: [adverbs]}
      - id: colours
        kind: vocab
        title: {en: Colours, nl: Kleuren}
        icon: colors
        requires: [adjectives]
        items: {tags: [colours]}
      - id: possessives
        kind: grammar
        title: {en: "My, your, his: possessives", nl: "Mijn, jouw, zijn: bezittelijke voornaamwoorden"}
        icon: person
        requires: [adjectives]
        items: {tags: [possessives]}
        inflections: {table: agreement}   # + #infl:agreement (mio, mia, miei, mie)

  - id: u5
    title: {en: Around town, nl: In de stad}
    skills:
      - id: city
        kind: vocab
        title: {en: In the city, nl: In de stad}
        icon: city
        requires: [colours, possessives]
        items: {tags: [city]}
      - id: travel
        kind: vocab
        title: {en: Travel, nl: Op reis}
        icon: travel
        requires: [colours, possessives]
        items: {tags: [travel]}
      - id: prepositions
        kind: grammar
        title: {en: "Prepositions: nel, al, del...", nl: "Voorzetsels: nel, al, del..."}
        icon: grammar
        requires: [city, travel]
        introduces: ["prep:articulated"]
        items: {tags: [prepositions]}

  - id: u6
    title: {en: The past, nl: Het verleden}
    skills:
      - id: work
        kind: vocab
        title: {en: Work and school, nl: Werk en school}
        icon: work
        requires: [prepositions]
        items: {tags: [work]}
      - id: passato-prossimo
        kind: grammar
        title: {en: The passato prossimo with avere, nl: De passato prossimo met avere}
        icon: past
        requires: [prepositions]
        verbs: {tense: passato_prossimo, aux: avere, top: 20}
        exercises: [conj_grid, cloze, spot_error, transform]
      - id: passato-prossimo-essere
        kind: grammar
        title: {en: The passato prossimo with essere, nl: De passato prossimo met essere}
        icon: past
        requires: [passato-prossimo]
        introduces: ["aux:essere"]
        verbs: {tense: passato_prossimo, aux: essere, top: 16, exclude: [stare, dispiacere, parere, importare]}
        exercises: [conj_grid, cloze, spot_error, transform]

  - id: u7
    title: {en: Memories, nl: Herinneringen}
    skills:
      - id: imperfetto
        kind: grammar
        title: {en: The imperfetto, nl: De imperfetto}
        icon: past
        requires: [passato-prossimo-essere]
        verbs: {tense: imperfetto, top: 20}
        exercises: [conj_pick, conj_grid, cloze, spot_error, transform]

  - id: u8
    title: {en: Plans for the future, nl: Plannen voor de toekomst}
    skills:
      - id: futuro
        kind: grammar
        title: {en: The future tense, nl: De toekomende tijd}
        icon: future
        requires: [imperfetto]
        # frozen at the 1.2.0 selection
        verbs: {tense: futuro, lemmas: [dire, pensare, parlare, capire, sentire, aspettare, sembrare, prendere, piacere,
                                        guardare, tornare, lasciare, cercare, chiamare, trovare, chiedere, conoscere, servire]}
        exercises: [conj_pick, conj_grid, cloze, spot_error, transform]
      - id: futuro-irregular
        kind: grammar
        title: {en: Irregular futures, nl: Onregelmatige toekomende tijd}
        icon: future
        requires: [futuro]
        introduces: ["irregular:futuro"]
        verbs: {tense: futuro, regular: false, top: 16, exclude: [dispiacere, parere, supporre, piacere]}
        exercises: [conj_grid, cloze, spot_error, transform]

  - id: u9
    title: {en: Talking about life, nl: Praten over het leven}
    skills:
      - id: more-verbs
        kind: vocab
        title: {en: More verbs, nl: Meer werkwoorden}
        icon: verb
        requires: [futuro-irregular]
        items: {tags: [verbs2]}
      - id: ideas
        kind: vocab
        title: {en: Ideas and opinions, nl: Ideeën en meningen}
        icon: chat
        requires: [futuro-irregular]
        items: {tags: [ideas]}

  # ---- units 10-15 (pack 1.3, toward A2/B1): moods, pronouns, reading. English only (see the top).
  - id: u10
    title: {en: Daily routine, nl: De dagelijkse routine}
    skills:
      - id: little-words-2
        kind: vocab
        title: {en: "More little words: se, tutto, niente", nl: "Meer kleine woorden: se, tutto, niente"}
        icon: chat
        requires: [more-verbs, ideas]
        items: {tags: [little2]}
      - id: reflexive-present
        kind: grammar
        title: {en: "Reflexive verbs: mi alzo", nl: "Wederkerende werkwoorden: mi alzo"}
        icon: person
        requires: [little-words-2]
        introduces: [reflexive]
        verbs: {tense: presente, lemmas: [chiamarsi, alzarsi, svegliarsi, sentirsi, vestirsi, lavarsi, divertirsi,
                                          preoccuparsi, dimenticarsi, sbagliarsi, fermarsi, sedersi, trovarsi,
                                          addormentarsi, arrabbiarsi, innamorarsi, riposarsi, annoiarsi,
                                          prepararsi, andarsene]}
