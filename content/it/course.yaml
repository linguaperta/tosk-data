        items: {tags: [ci_ne]}
      - id: combined-pronouns
        kind: grammar
        title: {en: "Glielo, me lo, te ne: combined pronouns", nl: "Glielo, me lo, te ne: samengestelde voornaamwoorden"}
        icon: grammar
        requires: [ci-ne]
        introduces: ["pronoun:combined", "pronoun:attached"]
        items: {tags: [combined]}
      - id: condizionale
        kind: grammar
        title: {en: "The conditional: parlerei", nl: "De voorwaardelijke wijs: parlerei"}
        icon: star
        requires: [ci-ne]
        verbs: {tense: condizionale, regular: true, top: 16, exclude: [dispiacere]}
