        verbs: {tense: congiuntivo_presente, lemmas: [pensare, parlare, sentire, capire, prendere, aspettare, guardare, lasciare,
                                                      tornare, trovare, chiamare, cercare, chiedere, conoscere, arrivare, mangiare,
                                                      scrivere, dormire]}
        exercises: [conj_pick, conj_grid, cloze, spot_error]
      - id: congiuntivo-irregular
