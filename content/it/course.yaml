        icon: verb
        requires: [reflexive-past]
        introduces: ["imperative:negative"]
        verbs: {tense: imperativo, lemmas: [parlare, guardare, ascoltare, aspettare, prendere, scrivere, leggere, sentire,
                                            aprire, chiudere, finire, mangiare, entrare, chiamare, lasciare, pensare, provare,
                                            mettere]}
        exercises: [conj_pick, conj_grid, cloze, spot_error]
      - id: imperative-irregular
        kind: grammar
        title: {en: "Irregular imperatives: va', fa', di'", nl: "Onregelmatige gebiedende wijs: va', fa', di'"}
        icon: bolt
        requires: [imperative]
        introduces: ["irregular:imperativo"]
        verbs: {tense: imperativo, lemmas: [essere, avere, andare, fare, dire, dare, stare, venire, tenere, uscire, rimanere,
                                            bere, salire, scegliere]}
        exercises: [conj_grid, cloze, spot_error]
      - id: imperative-pronouns
        kind: grammar
        title: {en: "Imperative with pronouns: alzati, dimmi", nl: "Gebiedende wijs met voornaamwoorden: alzati, dimmi"}
