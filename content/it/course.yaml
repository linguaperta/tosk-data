# Topics (pack format 1.2, tosk/docs/pack-format.md "Topics"): themed side trees, each drawn as its own
# map, with a branch leaving the main tree at its anchor (the last main-tree skill its first skill
# requires); a later skill of a topic may require a later main-tree skill and waits for it.
# Pack 1.5 (tosk/docs/topic-split.md): the main tree keeps the grammar and the core vocabulary, and
# themed vocabulary lives in these topics, so a learner may skip them. Grammar skills require only
# main-tree skills. The fairness rule (tosk/docs/extensions.md): never unknown grammar, some unknown
# words are fine: words of a skipped topic may appear in main-tree lessons within the unknown-word
# cap, and in main-tree stories (at most three per story, glossed). Skill, item and facet ids are
# unchanged, so progress is kept.
topics:
  # The body (unit 4 until pack 1.5) with the daily routine and the doctor's (unit 10).
  - id: salute
    title: {en: Body and health, nl: Lichaam en gezondheid}
    short_title: {en: Health, nl: Gezondheid}
    description:
      en: "The body, washing and dressing, and a visit to the doctor."
      nl: "Het lichaam, wassen en aankleden, en een bezoek aan de dokter."
    icon: health
    units:
      - id: salute-u1
        title: {en: The body, nl: Het lichaam}
        skills:
          - id: body
            kind: vocab
            title: {en: The body, nl: Het lichaam}
            icon: body
            requires: [adjectives]
            items: {tags: [body]}
      - id: salute-u2
        title: {en: Daily care and the doctor, nl: Verzorging en de dokter}
        skills:
          - id: routine
            kind: vocab
            title: {en: From morning to night, nl: Van 's ochtends tot 's avonds}
            icon: clock
            requires: [body, reflexive-present]
            items: {tags: [routine]}
          - id: health
            kind: vocab
            title: {en: At the doctor's, nl: Bij de dokter}
            icon: health
            requires: [body, reflexive-present]
            items: {tags: [health]}

  # In the kitchen (unit 5; its story uses the articulated prepositions) and cooking (unit 11, written in
  # the imperative).
  - id: cucina
    title: {en: Food and cooking, nl: Eten en koken}
    short_title: {en: Cooking, nl: Koken}
    description:
      en: "Fruit, vegetables and the kitchen, then recipes in the imperative."
      nl: "Fruit, groente en de keuken, daarna recepten in de gebiedende wijs."
    icon: food
