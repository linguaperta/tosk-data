# Curated vocabulary for the Dutch course (input for `python -m pipeline import nl`).
# tags put an item in a vocab skill. English glosses written here are Claude-authored
# (tr_src: claude); items without en take their gloss from Wiktionary.
# Words never taken into the automatic frequency pool (Wiktionary homographs and inflected
# forms that inherit a misleading frequency): lemma or lemma/pos.
exclude: [reet, beuren, dagen/verb, manen/verb, ogen/verb, dingen/verb, weet/noun, kan/noun, wil/noun, was/noun, kom/noun, want/noun, hen/noun, ie/pron, vrouwe, wilde/noun, goede/noun, mijn/noun, waren/verb, lo/noun, a/noun]
