  title: {nl: "Te laat", en: "Too late"}
  sentences:
    - {nl: "Daan staat om zes uur op.", en: "Daan gets up at six o'clock."}
    - {nl: "Hij wast zich en drinkt koffie.", en: "He washes and drinks coffee."}
    - {nl: "Dan zoekt hij de sleutel.", en: "Then he looks for the key."}
    - {nl: "Niet in de keuken, niet in de kamer...", en: "Not in the kitchen, not in the living room..."}
    - {nl: "Om half negen vindt hij de sleutel in de badkamer.", en: "At half past eight he finds the key in the bathroom."}
    - {nl: "Hij fietst heel hard, maar hij komt te laat.", en: "He cycles very fast, but he's late."}
