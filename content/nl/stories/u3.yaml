# Graded mini-stories for unit u3 (pipeline/pipeline/stories.py). Written by Claude (claude-gen).
- id: u3-oma
  unit: u3
  title: {nl: "Zaterdag bij oma", en: "Saturday at grandma's"}
  sentences:
    - {nl: "Op zaterdag gaat Lisa altijd naar oma.", en: "On Saturdays Lisa always goes to her grandma's."}
    - {nl: "Oma woont in Utrecht, in een huis met een tuin.", en: "Grandma lives in Utrecht, in a house with a garden."}
    - {nl: "Ze drinken thee en praten over de familie.", en: "They drink tea and talk about the family."}
    - {nl: "Oma vertelt over opa en over haar bruiloft.", en: "Grandma tells her about grandpa and about her wedding."}
    - {nl: "Om zes uur kookt oma en Lisa helpt.", en: "At six o'clock grandma cooks and Lisa helps."}
    - {nl: "Dan eten ze en kijken ze televisie.", en: "Then they eat and watch television."}
    - {nl: "Om negen uur gaat Lisa naar huis.", en: "At nine o'clock Lisa goes home."}
  questions:
    - q: {en: "When does Lisa visit her grandma?"}
      prompt: "Wanneer gaat Lisa naar oma?"
      options: ["op zaterdag", "op zondag", "op maandag"]
      answer: 0
    - q: {en: "What do they talk about?"}
      options: [{en: "The family"}, {en: "School"}, {en: "The garden"}]
      answer: 0
    - q: {en: "What time does Lisa go home?"}
      prompt: "Hoe laat gaat Lisa naar huis?"
      options: ["om negen uur", "om zes uur", "om tien uur"]
      answer: 0

- id: u3-te-laat
