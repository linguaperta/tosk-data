- id: u8-droom
  unit: u8
  title: {nl: "Bram vliegt", en: "Bram flies"}
  new_words: [toen]
  sentences:
    - {nl: "Bram droomde dat hij een vogel was.", en: "Bram dreamt that he was a bird."}
    - {nl: "Hij vloog over de stad.", en: "He flew over the city."}
    - {nl: "Hij zag de school en het huis van oma.", en: "He saw the school and grandma's house."}
    - {nl: "Toen viel hij in een rivier vol vissen.", en: "Then he fell into a river full of fish."}
    - {nl: "De vissen lachten en praatten met hem!", en: "The fish laughed and talked to him!"}
    - {nl: "Bram wilde praten, maar hij had geen stem.", en: "Bram wanted to talk, but he had no voice."}
    - {nl: "Toen hoorde hij mama: \"Bram, opstaan!\"", en: "Then he heard his mum: \"Bram, get up!\""}
    - {nl: "Bij het ontbijt vertelde Bram over de vissen.", en: "At breakfast Bram told everyone about the fish."}
  questions:
    - q: {en: "What was Bram in the dream?"}
      options: [{en: "A bird"}, {en: "A fish"}, {en: "A horse"}]
      answer: 0
    - q: {en: "Where did he fall?"}
      prompt: "Waar viel hij in?"
      options: ["in een rivier", "in de zee", "in een bos"]
      answer: 0
    - q: {en: "Who woke him up?"}
      options: [{en: "His mum"}, {en: "His grandma"}, {en: "A fish"}]
      answer: 0
