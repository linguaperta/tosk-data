- id: u8-concert
  unit: u8
  title: {nl: "Het concert van Sanne", en: "Sanne's concert"}
  sentences:
    - {nl: "Sanne speelt al tien jaar piano.", en: "Sanne has been playing the piano for ten years."}
    - {nl: "Vanavond geeft ze haar eerste concert.", en: "Tonight she's giving her first concert."}
    - {nl: "Haar hele familie komt, en ze is heel zenuwachtig.", en: "Her whole family is coming, and she's very nervous."}
    - {nl: "Ze begint met een lied van haar opa.", en: "She starts with a song by her grandpa."}
    - {nl: "Haar vingers zijn koud, maar ze speelt goed.", en: "Her fingers are cold, but she plays well."}
    - {nl: "Aan het eind staan de mensen op.", en: "At the end the people stand up."}
    - {nl: "Sanne lacht, en haar moeder huilt.", en: "Sanne laughs, and her mother cries."}
