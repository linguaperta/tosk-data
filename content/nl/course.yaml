# Dutch course for English speakers.
# Skills select their items with queries (see tosk/pipeline/pipeline/query.py); the
# compiler resolves them into skill_items/skill_facets, so the app never reads these queries.
#
# Grammar gating (tosk/docs/ARCHITECTURE.md, "Grammar gating"; pipeline/pipeline/features.py):
# a learner never meets a grammar construct before the skill that introduces it. The present tense
# is allowed from the start; every other feature below is introduced by one skill (a verbs skill
# introduces tense:{T} automatically). Each unit's skills require the previous unit's grammar, so
# every later skill allows everything taught before it.
id: nl
version: 1.2.1
title: {en: Dutch, nl: Nederlands}
description:
  en: Dutch from the basics, with a strong focus on verbs, the perfect tense and de/het.
  nl: Nederlands vanaf de basis, met veel aandacht voor werkwoorden, het perfectum en de/het.
target: nl
translations: [en]
unverified: false
persons: [ik, jij, hij/zij, wij, jullie, zij]
person_labels:
  jij: {en: "jij/je (you)", nl: "jij/je"}
  hij/zij: {en: "hij/zij/het (he/she/it)", nl: "hij/zij/het"}
  wij: {en: "wij/we (we)", nl: "wij/we"}
  jullie: {en: "jullie (you, plural)", nl: "jullie"}
  zij: {en: "zij/ze (they)", nl: "zij/ze (meervoud)"}
tenses: [tegenwoordige_tijd, verleden_tijd, perfectum]
tense_labels:
  tegenwoordige_tijd: {en: present, nl: tegenwoordige tijd}
  verleden_tijd: {en: simple past, nl: verleden tijd}
  perfectum: {en: present perfect, nl: voltooid tegenwoordige tijd}
articles: [de, het]

# Inflection tables of non-verbs (tosk/docs/ARCHITECTURE.md, "Inflection tables"; the importer
# fills them from Wiktionary, pipeline/pipeline/inflect.py). Skills train them with
# `inflections: {table: T}` (facet #infl:T). `agreement`: the cell follows from the sentence (the
# -e before a noun), so in a sentence the other cell is wrong.
inflection_tables:
  number:
    title: {en: singular and plural, nl: enkelvoud en meervoud}
    pos: [noun]
    cells: [sg, pl]
    base: sg
    labels:
      sg: {en: singular, nl: enkelvoud}
      pl: {en: plural, nl: meervoud}
  agreement:
    title: {en: adjective ending, nl: buigings-e}
    pos: [adj]
    cells: [base, infl]
    base: base
    agreement: true
    labels:
      base: {en: without -e, nl: zonder -e}
      infl: {en: with -e, nl: met -e}
  comparison:
    title: {en: comparison, nl: trappen van vergelijking}
    pos: [adj]
    cells: [base, comparative, superlative]
    base: base
    labels:
      base: {en: base form, nl: stellende trap}
      comparative: {en: comparative, nl: vergrotende trap}
      superlative: {en: superlative, nl: overtreffende trap}
  diminutive:
    title: {en: diminutive, nl: verkleinwoord}
    pos: [noun]
    cells: [sg, dim]
    base: sg
    labels:
      sg: {en: noun, nl: zelfstandig naamwoord}
      dim: {en: diminutive, nl: verkleinwoord}

base_features: ["tense:tegenwoordige_tijd"]
feature_detectors:
  # perfect with zijn (ik ben gegaan): introduced after the hebben-perfect
  "aux:zijn": {type: compound_aux, aux: zijn}
  # modal verb + infinitive (ik wil slapen, je moet gaan, we zullen zien)
  modal: {type: modal_infinitive, verbs: [kunnen, moeten, willen, mogen, zullen, hoeven]}
  # separable verbs, split (hij komt morgen terug) or whole (opstaan, teruggekomen)
  separable:
    type: separable
    particles: [aan, af, achter, bij, binnen, buiten, door, in, langs, los, mee, mis, na, neer, om, onder,
                op, open, dicht, over, rond, samen, tegen, terecht, terug, thuis, toe, uit, vast, voor,
                voorbij, weg]
  # strong and irregular simple past (ging, kwam, was, had, zei)
  "irregular:verleden_tijd": {type: irregular_tense, tense: verleden_tijd}

# Time adverbs (whole words, case-insensitive) and the tenses they fit. The app never rewrites a
# sentence with one of these into another tense (transform exercise: no *Gisteren eet ik).
time_adverbs:
  nu: [tegenwoordige_tijd]
  momenteel: [tegenwoordige_tijd]
  tegenwoordig: [tegenwoordige_tijd]
  op dit moment: [tegenwoordige_tijd]
  gisteren: [verleden_tijd, perfectum]
  eergisteren: [verleden_tijd, perfectum]
  gisteravond: [verleden_tijd, perfectum]
  gistermiddag: [verleden_tijd, perfectum]
  gisterochtend: [verleden_tijd, perfectum]
  vorige: [verleden_tijd, perfectum]
  vorig: [verleden_tijd, perfectum]
  geleden: [verleden_tijd, perfectum]
  toen: [verleden_tijd, perfectum]
  zojuist: [verleden_tijd, perfectum]
  zonet: [verleden_tijd, perfectum]
  onlangs: [verleden_tijd, perfectum]
  morgen: [tegenwoordige_tijd]
  overmorgen: [tegenwoordige_tijd]
  morgenochtend: [tegenwoordige_tijd]
  morgenavond: [tegenwoordige_tijd]
  volgende: [tegenwoordige_tijd]
  volgend: [tegenwoordige_tijd]
  straks: [tegenwoordige_tijd]
  binnenkort: [tegenwoordige_tijd]

units:
  - id: u1
    title: {en: Basics, nl: Basis}
    skills:
      - id: greetings
        kind: vocab
        title: {en: Greetings, nl: Begroetingen}
        icon: wave
        items: {tags: [greetings]}
      - id: little-words
        kind: vocab
        title: {en: Little words, nl: Kleine woorden}
        icon: chat
        requires: [greetings]
        items: {tags: [little]}
      - id: people
        kind: vocab
        title: {en: People, nl: Mensen}
        icon: people
        requires: [greetings]
        items: {tags: [people]}
      - id: present-regular
        kind: grammar
        title: {en: The present tense, nl: De tegenwoordige tijd}
        icon: verb
        requires: [little-words, people]
        verbs: {tense: tegenwoordige_tijd, regular: true, top: 20,
                exclude: [gaan, doen, staan, zien, slaan, komen, weten, zeggen, moeten, worden]}
        exercises: [conj_pick, conj_grid, cloze, spot_error, transform]

  - id: u2
    title: {en: Daily life, nl: Dagelijks leven}
    skills:
      - id: food
        kind: vocab
        title: {en: Food and drink, nl: Eten en drinken}
        icon: food
        requires: [present-regular]
        items: {tags: [food]}
      - id: numbers
        kind: vocab
        title: {en: Numbers, nl: Getallen}
        icon: numbers
        requires: [present-regular]
        items: {tags: [numbers]}
      - id: present-irregular
        kind: grammar
        title: {en: "Key verbs: zijn, hebben and modals", nl: "Kernwerkwoorden: zijn, hebben en modale werkwoorden"}
        icon: key
        requires: [present-regular]
        introduces: [modal]
        verbs: {tense: tegenwoordige_tijd,
                lemmas: [zijn, hebben, kunnen, willen, mogen, moeten, zullen, gaan, doen, komen,
                         staan, zien, weten, zeggen, worden]}
        exercises: [conj_grid, cloze, spot_error, transform]
      - id: home
        kind: vocab
        title: {en: At home, nl: Thuis}
        icon: home
        requires: [food]
        items: {tags: [home]}
      - id: de-het
        kind: grammar
        title: {en: De or het, nl: De of het}
        icon: article
        requires: [home]
        facet: article
        # nouns with both articles (mens: de/het, seed.yaml) have no #article facet
        items: {pos: noun, tags: [people, food, home], exclude: [mens]}

  - id: u3
    title: {en: Everyday life, nl: Het dagelijks leven}
    skills:
      - id: time
        kind: vocab
        title: {en: Time and days, nl: Tijd en dagen}
        icon: clock
        requires: [present-irregular, de-het]
        items: {tags: [time]}
      - id: family
        kind: vocab
        title: {en: Family, nl: Familie}
        icon: family
        requires: [present-irregular, de-het]
        items: {tags: [family]}
      - id: everyday-verbs
        kind: vocab
        title: {en: Everyday verbs, nl: Alledaagse werkwoorden}
        icon: verb
        requires: [present-irregular, de-het]
        items: {tags: [verbs1]}
      - id: pronouns
        kind: grammar
        title: {en: "Me, you, him: object pronouns", nl: "Mij, jou, hem: voornaamwoorden als voorwerp"}
        icon: person
        requires: [present-irregular, de-het]
        items: {tags: [pronouns]}
      - id: separable
        kind: grammar
        title: {en: Separable verbs, nl: Scheidbare werkwoorden}
        icon: verb
        requires: [everyday-verbs]
        introduces: [separable]
        items: {tags: [separable]}
      - id: plurals
        kind: grammar
        title: {en: "One and many: plurals", nl: "Een en meer: het meervoud"}
        icon: grammar
        requires: [family]
        facet: infl
        inflections: {table: number}      # #infl:number: katten, huizen, auto's
        items: {pos: noun, tags: [people, food, home, family], top: 30}

  - id: u4
    title: {en: The perfect tense, nl: De voltooide tijd}
    skills:
      - id: work
        kind: vocab
        title: {en: Work and school, nl: Werk en school}
        icon: work
        requires: [separable, pronouns, time]
        items: {tags: [work]}
      - id: feelings
        kind: vocab
        title: {en: Feelings, nl: Gevoelens}
        icon: person
        requires: [separable, pronouns, time]
        items: {tags: [feelings]}
      - id: perfectum-hebben
        kind: grammar
        title: {en: "Perfect tense with hebben", nl: "Perfectum met hebben"}
        icon: past
        requires: [separable, pronouns, time]
        verbs: {tense: perfectum, aux: hebben, top: 20, exclude: [moeten]}
        exercises: [conj_grid, cloze, spot_error, transform]
      - id: perfectum-zijn
        kind: grammar
        title: {en: "Perfect tense with zijn", nl: "Perfectum met zijn"}
        icon: past
        requires: [perfectum-hebben]
        introduces: ["aux:zijn"]
        verbs: {tense: perfectum, aux: zijn, top: 16, exclude: [oplossen]}
        exercises: [conj_grid, cloze, spot_error, transform]

  - id: u5
    title: {en: Describing things, nl: Dingen beschrijven}
    skills:
      - id: adjectives
        kind: grammar
        title: {en: Adjectives, nl: Bijvoeglijke naamwoorden}
        icon: grammar
        requires: [perfectum-zijn]
        items: {tags: [adjectives]}
        inflections: {table: agreement}   # + #infl:agreement (groot / grote)
      - id: body
        kind: vocab
        title: {en: Body and health, nl: Lichaam en gezondheid}
        icon: body
        requires: [perfectum-zijn]
        items: {tags: [body]}
      - id: adverbs
        kind: vocab
        title: {en: Useful adverbs, nl: Handige bijwoorden}
        icon: star
        requires: [perfectum-zijn]
        items: {tags: [adverbs]}
      - id: colours
        kind: vocab
        title: {en: Colours, nl: Kleuren}
        icon: colors
        requires: [adjectives]
        items: {tags: [colours]}
      - id: possessives
        kind: grammar
        title: {en: "My, your, his: possessives", nl: "Mijn, jouw, zijn: bezittelijke voornaamwoorden"}
        icon: person
        requires: [adjectives]
        items: {tags: [possessives]}
      - id: diminutives
        kind: grammar
        title: {en: "Small words: diminutives", nl: "Verkleinwoorden"}
        icon: grammar
        requires: [adjectives]
        facet: infl
        inflections: {table: diminutive}  # #infl:diminutive: huisje, boompje, kopje
        items: {pos: noun, tags: [people, food, home, family, time, body], top: 25}

  - id: u6
    title: {en: Around town, nl: In de stad}
    skills:
      - id: city
        kind: vocab
        title: {en: In the city, nl: In de stad}
        icon: city
        requires: [colours, possessives]
        items: {tags: [city]}
      - id: travel
        kind: vocab
        title: {en: Travel, nl: Op reis}
        icon: travel
        requires: [colours, possessives]
        items: {tags: [travel]}
      - id: kitchen
        kind: vocab
        title: {en: In the kitchen, nl: In de keuken}
        icon: food
        requires: [colours, possessives]
        items: {tags: [kitchen]}
      - id: shopping
        kind: vocab
        title: {en: Shopping, nl: Winkelen}
        icon: shopping
        requires: [city]
        items: {tags: [shopping]}

  - id: u7
    title: {en: The simple past, nl: De verleden tijd}
    skills:
      - id: weather
        kind: vocab
        title: {en: Weather and nature, nl: Weer en natuur}
        icon: weather
        requires: [shopping, travel]
        items: {tags: [weather]}
      - id: animals
        kind: vocab
        title: {en: Animals, nl: Dieren}
        icon: animals
        requires: [shopping, travel]
        items: {tags: [animals]}
      - id: clothes
        kind: vocab
        title: {en: Clothes, nl: Kleding}
        icon: clothes
        requires: [shopping, travel]
        items: {tags: [clothes]}
      - id: verleden-tijd-weak
        kind: grammar
        title: {en: "Simple past: weak verbs", nl: "Verleden tijd: zwakke werkwoorden"}
        icon: past
        requires: [shopping, travel]
        verbs: {tense: verleden_tijd, class: weak, regular: true, top: 20, exclude: [jongen, vermoorden]}
        exercises: [conj_pick, conj_grid, cloze, spot_error, transform]
      - id: verleden-tijd-strong
        kind: grammar
        title: {en: "Simple past: strong and irregular verbs", nl: "Verleden tijd: sterke en onregelmatige werkwoorden"}
        icon: past
        requires: [verleden-tijd-weak]
        introduces: ["irregular:verleden_tijd"]
        verbs: {tense: verleden_tijd, regular: false, top: 20, exclude: [zullen]}
        exercises: [conj_grid, cloze, spot_error, transform]

  - id: u8
    title: {en: Free time and ideas, nl: Vrije tijd en ideeën}
    skills:
      - id: leisure
        kind: vocab
        title: {en: Free time, nl: Vrije tijd}
        icon: star
        requires: [verleden-tijd-strong]
        items: {tags: [leisure]}
      - id: more-verbs
        kind: vocab
        title: {en: More verbs, nl: Meer werkwoorden}
        icon: verb
        requires: [verleden-tijd-strong]
        items: {tags: [verbs2]}
      - id: ideas
        kind: vocab
        title: {en: Ideas and opinions, nl: Ideeën en meningen}
        icon: chat
        requires: [verleden-tijd-strong]
        items: {tags: [ideas]}
